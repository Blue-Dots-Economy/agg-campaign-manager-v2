sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_agg-campaign-manager-v2
sonar.projectName=agg-campaign-manager-v2

# Application source. The Supabase config under supabase/ is not analysed.
sonar.sources=src

# There are no tests in this repository, so there is nothing to put in
# sonar.tests and no coverage report to import. Add both when a runner exists.

# routeTree.gen.ts is regenerated by every build (it reorders its own imports,
# so it churns without any real change) and src/components/ui is shadcn's
# generated component set.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.vinxi/**,src/routeTree.gen.ts,src/components/ui/**

# Migrations are generated SQL (the baseline is the Supabase schema as dumped,
# unchanged per design D6). Duplication only; everything else is still analysed.
# Automatic Analysis reads the same setting from .sonarcloud.properties.
sonar.cpd.exclusions=src/server/db/migrations/**

sonar.sourceEncoding=UTF-8
