# Read by SonarCloud's Automatic Analysis, which ignores sonar-project.properties.
# Keep the scope below in step with sonar-project.properties (used by the CI scan).

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.vinxi/**,src/routeTree.gen.ts,src/components/ui/**

# Migrations are generated SQL: 0000_baseline.sql is the Supabase schema as
# dumped, kept unchanged on purpose (design D6). Excluded from duplication only;
# bugs, vulnerabilities and code smells are still analysed.
sonar.cpd.exclusions=src/server/db/migrations/**

sonar.sourceEncoding=UTF-8
