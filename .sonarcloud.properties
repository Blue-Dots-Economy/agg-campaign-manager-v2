# Read by SonarCloud's Automatic Analysis, which ignores sonar-project.properties.
# Keep the scope below in step with sonar-project.properties (used by the CI scan).

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.vinxi/**,src/routeTree.gen.ts,src/components/ui/**,src/server/db/migrations/**

# src/server/db/migrations is excluded above: generated SQL. 0000_baseline.sql
# is the Supabase schema as dumped, kept unchanged on purpose (design D6), so
# its duplication and PL/SQL rule findings are not something to change in place.

sonar.sourceEncoding=UTF-8
